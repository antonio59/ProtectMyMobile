name: Update Changelog

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit & Push Changelog
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ref="$REF_NAME"
          # git-cliff-action installs the binary here and does not add it to PATH.
          cliff="${RUNNER_TEMP}/git-cliff/bin/git-cliff"

          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: update changelog [skip ci]"

          # The branch can receive another push while git-cliff is running.
          # Replaying this commit then conflicts on CHANGELOG.md, and
          # `git rebase --continue` cannot finish on the runner: GitHub Actions
          # has no TTY and no EDITOR, so Git exits with
          # "Terminal is dumb, but EDITOR unset". The file is generated from
          # history, and this copy was generated before those commits existed,
          # so drop it and generate it again. Only a fast-forward (remote tip
          # is this commit's parent) is pushed as-is.
          for attempt in 1 2 3; do
            git fetch origin "$ref"
            if [ "$(git rev-parse "origin/$ref")" != "$(git rev-parse "HEAD^")" ]; then
              echo "${ref} moved; regenerating changelog (attempt ${attempt})"
              git reset --hard "origin/$ref"
              GIT_CLIFF_OUTPUT=CHANGELOG.md "$cliff" --config cliff.toml
              git add CHANGELOG.md
              if git diff --staged --quiet; then
                echo "No changes to commit"
                exit 0
              fi
              git commit -m "docs: update changelog [skip ci]"
            fi
            if git push; then
              exit 0
            fi
            echo "Push rejected; retrying (attempt ${attempt})"
          done
          echo "Failed to update changelog" >&2
          exit 1

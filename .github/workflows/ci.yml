name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          pnpm install
          pnpm install lightningcss-linux-x64-gnu

      - name: Type check
        run: pnpm run check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          pnpm install
          pnpm install lightningcss-linux-x64-gnu

      - name: Security audit
        run: pnpm audit --prod

  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          pnpm install
          pnpm install lightningcss-linux-x64-gnu

      - name: Lint DESIGN.md
        run: pnpm run design:lint

      - name: Verify token export
        run: |
          pnpm run design:export
          git diff --exit-code src/styles/design-tokens.json || (echo "Token export is out of sync with DESIGN.md. Run 'pnpm run design:export' and commit the changes." && exit 1)

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, design-system]
    steps:
      - uses: actions/checkout@v6

      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          pnpm install
          pnpm install lightningcss-linux-x64-gnu

      - name: Build
        run: pnpm run build
        env:
          PUBLIC_CONVEX_URL: ${{ secrets.PUBLIC_CONVEX_URL || 'https://example.convex.cloud' }}
          RESEND_API_KEY: "mock-key-for-build"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

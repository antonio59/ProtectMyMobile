name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Security audit
      run: bun audit

    - name: Build Project
      run: bun run build
      env:
        PUBLIC_CONVEX_URL: ${{ secrets.PUBLIC_CONVEX_URL || 'https://example.convex.cloud' }}
        RESEND_API_KEY: 'mock-key-for-build'

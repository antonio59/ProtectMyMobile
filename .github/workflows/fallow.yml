name: Fallow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  analyze:
    name: Code Quality & Dead Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          pnpm install
          pnpm install lightningcss-linux-x64-gnu

      - name: Run Fallow (dead-code)
        run: pnpm dlx fallow --only dead-code --fail-on-issues --format compact

      - name: Run Fallow (duplication)
        run: pnpm dlx fallow --only dupes --format compact
        continue-on-error: true

      - name: Run Fallow (health)
        run: pnpm dlx fallow --only health --format compact
        continue-on-error: true

      - name: Run Fallow (full + SARIF)
        run: pnpm dlx fallow --format sarif --sarif-file=fallow-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        if: hashFiles('fallow-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: fallow-results.sarif
          category: fallow

      - name: Save regression baseline (main branch only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p .fallow
          pnpm dlx fallow --save-regression-baseline .fallow/regression-baseline.json --format compact

      - name: Check for regressions (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if [ -f .fallow/regression-baseline.json ]; then
            pnpm dlx fallow --fail-on-regression --regression-baseline .fallow/regression-baseline.json --format compact
          else
            echo "No baseline found; skipping regression check."
          fi

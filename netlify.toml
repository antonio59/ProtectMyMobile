[build]
  command = "bun install && bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  BUN_VERSION = "1.3.3"

[functions]
  directory = "netlify/functions"

# ============================================
# Security Headers
# ============================================

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking attacks
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Enable XSS filter (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions Policy - restrict browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Content Security Policy - restrict resource loading
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://giddy-civet-983.convex.cloud; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://giddy-civet-983.convex.cloud https://www.reddit.com https://api.resend.com wss://giddy-civet-983.convex.cloud; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    # Strict Transport Security (HTTPS only)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ============================================
# Scheduled Functions
# ============================================

# Daily news fetch - runs at 6am and 6pm UTC
[functions."scheduled-news"]
  schedule = "0 6,18 * * *"

# Daily WDTK monitor - runs at 8am UTC
[functions."scheduled-wdtk"]
  schedule = "0 8 * * *"

# Weekly police.uk data refresh - Sundays at 3am UTC
[functions."scheduled-police-data"]
  schedule = "0 3 * * 0"

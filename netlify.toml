[build]
  command = "bun install --frozen-lockfile && bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  BUN_VERSION = "1.3.3"

[functions]
  directory = "netlify/functions"

[[context.production.environment]]
CRON_SECRET = "CHANGE_ME_IN_NETLIFY_DASHBOARD"

[context.develop.environment]
CRON_SECRET = "dev-secret-key"

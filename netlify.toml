[build]
  command = "curl -fsSL https://bun.sh/install | bash && export PATH=\"$HOME/.bun/bin:$PATH\" && bun install --frozen-lockfile && bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# ============================================
# Security Headers
# ============================================

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking attacks
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Enable XSS filter (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions Policy - restrict browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Content Security Policy - restrict resource loading
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://giddy-civet-983.convex.cloud https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://giddy-civet-983.convex.cloud https://api.resend.com wss://giddy-civet-983.convex.cloud; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    # Strict Transport Security (HTTPS only)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ============================================
# Scheduled Functions
# ============================================
# Note: For Netlify Functions v2, schedules are defined in each function file
# via `export const config: Config = { schedule: "..." }`. The entries below
# are kept for visibility but are ignored by the v2 runtime.

# Daily news fetch - runs at 8am UTC (see scheduled-news.ts)
[functions."scheduled-news"]
  schedule = "0 8 * * *"

# Daily WDTK monitor - runs at 8am UTC (see scheduled-wdtk.ts)
[functions."scheduled-wdtk"]
  schedule = "0 8 * * *"

# Weekly police.uk data refresh - Sundays at 3am UTC (see scheduled-police-data.ts)
[functions."scheduled-police-data"]
  schedule = "0 3 * * 0"

packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  yaml: 2.9.0
  esbuild: ^0.28.1
  ws: ^8.21.0
  vite: ^8.0.13
  js-yaml: ^4.3.2
  '@babel/core': ^7.29.1
  sharp: ^0.35.4
  postcss: ^8.5.26
  nanoid: ^3.3.18
  svgo: ^4.1.0
  # Patched URI parser (CVE-2026-76172 / 75899 / 75975 / 75931); 4.1.2 is still vulnerable
  fast-uri: ^4.1.4
  smol-toml: ^1.8.0
  browserslist: ^4.28.9
  'postcss-selector-parser@6': ^6.1.3
  'postcss-selector-parser@7': ^7.1.6
  colord: ^2.10.0
  baseline-browser-mapping: ^2.11.23
  # CVE-2026-81176 / Dependabot alert #90: devalue.parse DoS via malformed input
  devalue: ^5.9.2

pnpm:
  autoInstallPeers: true
  strictPeerDependencies: false
  packageImportMethod: clone-or-copy

# Audit exceptions: none currently. extract-zip advisories were resolved by
# removing the Netlify dev tooling that pulled it in.

packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true

overrides:
  yaml: 2.9.0
  tmp: ^0.2.6
  esbuild: ^0.28.1
  ws: ^8.21.0
  tar: ^7.5.22
  vite: ^8.0.13
  js-yaml: ^4.3.1
  '@babel/core': ^7.29.1
  '@opentelemetry/core': ^2.8.0
  sharp: ^0.35.3
  postcss: ^8.5.26
  nanoid: ^3.3.18
  svgo: ^4.0.2
  brace-expansion: ^5.0.9
  # Patched URI parser (CVE-2026-76172 / 75899 / 75975 / 75931); 4.1.2 is still vulnerable
  fast-uri: ^4.1.3
  browserslist: ^4.28.7
  toml: ^4.2.0
  'postcss-selector-parser@6': ^6.1.3
  'postcss-selector-parser@7': ^7.1.3
  '@netlify/blobs': ^11.0.1
  '@netlify/dev-utils': ^6.0.1
  # 2.0.5+ replaces extract-zip (CVE-2026-56876, no upstream patch) with yauzl
  '@netlify/functions-dev': ^2.0.5

pnpm:
  autoInstallPeers: true
  strictPeerDependencies: false
  packageImportMethod: clone-or-copy

packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true

overrides:
  yaml: 2.9.0
  tmp: ^0.2.6
  esbuild: ^0.28.1
  ws: ^8.21.0
  tar: ^7.5.22
  vite: ^8.0.13
  js-yaml: ^4.3.1
  '@babel/core': ^7.29.1
  '@opentelemetry/core': ^2.8.0
  sharp: ^0.35.3
  postcss: ^8.5.26
  nanoid: ^3.3.18
  svgo: ^4.0.2
  brace-expansion: ^5.0.9
  fast-uri: ^4.1.2
  '@netlify/blobs': ^11.0.1
  '@netlify/dev-utils': ^6.0.1
  '@netlify/functions-dev': ^2.0.1

pnpm:
  autoInstallPeers: true
  strictPeerDependencies: false
  packageImportMethod: clone-or-copy

# Audit exceptions: advisories with NO published fix upstream as of Aug 2026.
# Dev-only tooling path (Netlify local dev), not shipped runtime code.
# image-size advisories were resolved by overriding to @netlify/blobs@^11 /
# @netlify/dev-utils@^6, which no longer depend on image-size.
# Re-check periodically and delete entries once a patched release exists.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv  # extract-zip symlink traversal - no patch published (latest 2.0.1), dev-only via @netlify/functions-dev

packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  yaml: 2.9.0
  esbuild: ^0.28.1
  ws: ^8.21.0
  vite: ^8.0.13
  js-yaml: ^4.3.2
  '@babel/core': ^7.29.1
  sharp: ^0.35.4
  postcss: ^8.5.26
  nanoid: ^3.3.18
  svgo: ^4.1.0
  # GHSA-jvvf-x445-j334 / GHSA-hrr3-gc8f-f4qj (Dependabot #92); 4.1.4 is still vulnerable
  fast-uri: ^4.1.5
  smol-toml: ^1.8.0
  browserslist: ^4.28.9
  'postcss-selector-parser@6': ^6.1.3
  'postcss-selector-parser@7': ^7.1.6
  colord: ^2.10.0
  baseline-browser-mapping: ^2.11.23
  # CVE-2026-81176 / Dependabot alert #90: devalue.parse DoS via malformed input
  devalue: ^5.9.2
  # miniflare pins undici 7.29.0. Advisories below 7.29.1 (Dependabot #91) stay on the 7.x line; 8.x is already 8.11.2.
  'undici@7': ^7.29.1
  # http-cache-semantics through 4.2.0 (GHSA-ch52-4w7c-c8xp / GHSA-f27v-pv5m-c5g6)
  http-cache-semantics: ^4.3.0

pnpm:
  autoInstallPeers: true
  strictPeerDependencies: false
  packageImportMethod: clone-or-copy

# Audit exceptions: none currently. extract-zip advisories were resolved by
# removing the Netlify dev tooling that pulled it in.

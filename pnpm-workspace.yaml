packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  yaml: 2.9.0
  tmp: ^0.2.6
  esbuild: ^0.28.1
  ws: ^8.21.0
  tar: ^7.5.22
  vite: ^8.0.13
  js-yaml: ^4.3.2
  '@babel/core': ^7.29.1
  '@opentelemetry/core': ^2.8.0
  sharp: ^0.35.4
  postcss: ^8.5.26
  nanoid: ^3.3.18
  svgo: ^4.1.0
  brace-expansion: ^5.0.9
  # Patched URI parser (CVE-2026-76172 / 75899 / 75975 / 75931); 4.1.2 is still vulnerable
  fast-uri: ^4.1.4
  smol-toml: ^1.8.0
  browserslist: ^4.28.9
  toml: ^4.2.0
  'postcss-selector-parser@6': ^6.1.3
  'postcss-selector-parser@7': ^7.1.6
  colord: ^2.10.0
  baseline-browser-mapping: ^2.11.23

pnpm:
  autoInstallPeers: true
  strictPeerDependencies: false
  packageImportMethod: clone-or-copy

# Audit exceptions: none currently. extract-zip advisories were resolved by
# removing the Netlify dev tooling that pulled it in.

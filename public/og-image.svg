<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="200" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="100" cy="530" r="150" fill="#ffffff" fill-opacity="0.03"/>
  
  <!-- Red accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accentGradient)"/>
  
  <!-- Shield icon -->
  <g transform="translate(80, 180)">
    <path d="M50 0L100 20V60C100 93.137 78.5 123.5 50 140C21.5 123.5 0 93.137 0 60V20L50 0Z" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="3"/>
    <path d="M50 25L85 40V60C85 85 68 108 50 120C32 108 15 85 15 60V40L50 25Z" fill="#3b82f6" fill-opacity="0.3"/>
    <!-- Checkmark inside shield -->
    <path d="M35 65L45 75L65 55" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Main text -->
  <text x="200" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">
    ProtectMyMobile
  </text>
  
  <!-- Tagline -->
  <text x="200" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#94a3b8">
    UK's #1 Phone Theft Prevention Resource
  </text>
  
  <!-- Divider line -->
  <rect x="200" y="340" width="120" height="4" fill="url(#accentGradient)" rx="2"/>
  
  <!-- Features -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#cbd5e1">
    <text x="200" y="400">
      <tspan fill="#ef4444">●</tspan> Emergency Response Guide
    </text>
    <text x="200" y="445">
      <tspan fill="#f97316">●</tspan> UK Theft Statistics &amp; Hotspots
    </text>
    <text x="200" y="490">
      <tspan fill="#3b82f6">●</tspan> Prevention Tips &amp; Resources
    </text>
  </g>
  
  <!-- URL -->
  <text x="200" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#64748b">
    protectmymobile.xyz
  </text>
  
  <!-- UK Flag hint -->
  <g transform="translate(1020, 520)">
    <rect width="80" height="50" fill="#012169" rx="4"/>
    <path d="M0,0 L80,50 M80,0 L0,50" stroke="#ffffff" stroke-width="8"/>
    <path d="M0,0 L80,50 M80,0 L0,50" stroke="#C8102E" stroke-width="4"/>
    <path d="M40,0 V50 M0,25 H80" stroke="#ffffff" stroke-width="12"/>
    <path d="M40,0 V50 M0,25 H80" stroke="#C8102E" stroke-width="6"/>
  </g>
  
  <!-- Phone illustration on right -->
  <g transform="translate(900, 140)">
    <!-- Phone body -->
    <rect x="0" y="0" width="180" height="350" rx="24" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <!-- Screen -->
    <rect x="10" y="40" width="160" height="280" rx="4" fill="#111827"/>
    <!-- Alert on screen -->
    <circle cx="90" cy="140" r="40" fill="#ef4444" fill-opacity="0.2"/>
    <text x="90" y="150" font-family="system-ui, sans-serif" font-size="40" fill="#ef4444" text-anchor="middle">!</text>
    <text x="90" y="200" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">Phone Stolen?</text>
    <text x="90" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">We can help.</text>
    <!-- Notch -->
    <rect x="55" y="10" width="70" height="20" rx="10" fill="#111827"/>
  </g>
</svg>

<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Editorial system: ink ground, paper type, alert-red keyline -->
  <rect width="1200" height="630" fill="#16130F"/>

  <!-- Red keyline on the leading edge -->
  <rect x="0" y="0" width="10" height="630" fill="#C8322B"/>

  <!-- Subtle paper dot accents -->
  <circle cx="1100" cy="90" r="180" fill="#FAF8F5" fill-opacity="0.04"/>
  <circle cx="140" cy="560" r="130" fill="#FAF8F5" fill-opacity="0.04"/>

  <!-- Shield mark (flat ink badge, paper check, red accent) -->
  <g transform="translate(90, 120)">
    <path d="M48 0L96 19.2V70.8C96 106.4 73.6 137.2 48 148 22.4 137.2 0 106.4 0 70.8V19.2L48 0Z" fill="#FAF8F5"/>
    <path d="M28 73L44 89L72 56" stroke="#16130F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="20" r="9" fill="#C8322B"/>
  </g>

  <!-- Wordmark -->
  <text x="230" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#FAF8F5" letter-spacing="0.5">
    ProtectMyMobile
  </text>
  <text x="230" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#A39B8D" letter-spacing="3">
    UK PHONE THEFT PREVENTION &amp; RECOVERY
  </text>

  <!-- Headline (the tagline) -->
  <text x="90" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#FAF8F5">
    A phone is stolen in London
  </text>
  <text x="90" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#FAF8F5">
    every <tspan fill="#E0685F">five minutes</tspan>.
  </text>

  <!-- Red rule -->
  <rect x="90" y="470" width="120" height="5" fill="#C8322B" rx="2.5"/>

  <!-- Subline -->
  <text x="90" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#C9C2B6">
    Live police.uk data · Prevention checklists · Step-by-step emergency guide
  </text>

  <!-- URL -->
  <text x="90" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8A7A54">
    protectmymobile.xyz
  </text>
</svg>

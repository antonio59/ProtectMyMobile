<svg width="420" height="110" viewBox="0 0 420 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ProtectMyMobile logo</title>
  <desc id="desc">Flat ink shield badge with paper checkmark, alert-red accent, and serif ProtectMyMobile wordmark</desc>

  <!-- Shield badge (editorial: flat ink, paper check, red accent) -->
  <g transform="translate(24 18)">
    <path d="M24 0L48 9.6V35.4C48 53.2 36.8 68.6 24 74 11.2 68.6 0 53.2 0 35.4V9.6L24 0Z" fill="#16130F"/>
    <path d="M14 36.5L22 44.5L36 28" stroke="#FAF8F5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="10" r="4.5" fill="#C8322B"/>
  </g>

  <!-- Wordmark -->
  <text x="90" y="52" fill="#16130F" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" letter-spacing="0.1">ProtectMyMobile</text>
  <text x="90" y="76" fill="#6B6459" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="1">UK PHONE THEFT PREVENTION &amp; RECOVERY</text>

  <!-- Red keyline under the wordmark -->
  <rect x="90" y="86" width="72" height="4" rx="2" fill="#C8322B"/>
</svg>
